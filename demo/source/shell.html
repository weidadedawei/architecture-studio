<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DEMO · Architecture Studio</title>
  <!--STYLES-->
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h8v8H8z"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 0 14" transform="translate(0 -2)"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m16 4 5 5-5 5m5-5H11a7 7 0 0 0 0 14" transform="translate(0 -2)"/></symbol>
    <symbol id="i-node" viewBox="0 0 24 24"><rect x="3" y="4" width="13" height="16" rx="3"/><path d="M19 9v6m-3-3h6M7 9h5m-5 5h3"/></symbol>
    <symbol id="i-edge" viewBox="0 0 24 24"><path d="M6 5h5v14h7m-4-4 4 4-4 4"/><rect x="2" y="2" width="5" height="6" rx="1.5"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2ZM7 3v6h10V3M7 21v-8h10v8"/></symbol>
    <symbol id="i-load" viewBox="0 0 24 24"><path d="M3 9V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v1M3 9h18l-3 12H6z"/></symbol>
    <symbol id="i-page" viewBox="0 0 24 24"><path d="M14 2H5v20h14V7zM14 2v6h5m-8 4-3 3 3 3m3-6 3 3-3 3"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 15v6h16v-6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 3v7h7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-diagram" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="6" rx="2"/><rect x="2" y="16" width="8" height="6" rx="2"/><rect x="14" y="16" width="8" height="6" rx="2"/><path d="M12 8v4H6v4m6-4h6v4"/></symbol>
    <symbol id="i-network" viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="8" rx="2"/><path d="M12 2v6m0 8v6M2 12h6m8 0h6M4 4l5 5m6 6 5 5M20 4l-5 5M9 15l-5 5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a17 17 0 0 1 0 18 17 17 0 0 1 0-18Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
  </svg>

  <div class="app">
    <header class="page-header">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true"><svg><use href="#i-diagram"/></svg></div>
        <div class="brand-copy">
          <div class="eyebrow">DEMO <span> / </span> ARCHITECTURE STUDIO</div>
          <h1 id="pageTitle" data-i18n="ui.pageTitle">技术架构工作台</h1>
          <p id="pageSubtitle" data-i18n="ui.pageSubtitle">系统架构与网络拓扑 · 本地编辑，随时导出</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="local-badge"><span class="status-dot"></span><span data-i18n="ui.localOnly">本地离线</span></span>
        <div class="language-switch" aria-label="Language">
          <svg class="language-icon" aria-hidden="true"><use href="#i-globe"/></svg>
          <button id="langZh" type="button" lang="zh-CN" aria-pressed="true">中文</button>
          <button id="langEn" type="button" lang="en" aria-pressed="false">English</button>
        </div>
      </div>
    </header>

    <nav class="document-nav" aria-label="Diagrams">
      <div class="diagram-tabs" role="tablist" aria-label="Diagrams">
        <button id="systemTab" type="button" role="tab" aria-selected="true" aria-controls="workspace"><svg aria-hidden="true"><use href="#i-diagram"/></svg><span data-i18n="ui.system">系统技术架构</span></button>
        <button id="networkTab" type="button" role="tab" aria-selected="false" aria-controls="workspace"><svg aria-hidden="true"><use href="#i-network"/></svg><span data-i18n="ui.network">网络拓扑</span></button>
      </div>
      <span class="nav-note" data-i18n="ui.workspaceNote">同一工作台 · 两张独立可编辑图</span>
    </nav>

    <div class="toolbar" role="toolbar" aria-label="Diagram tools">
      <div class="tool-group view-tools">
        <button id="fit" type="button" class="tool-button"><svg aria-hidden="true"><use href="#i-fit"/></svg><span data-i18n="ui.fit">适应画布</span></button>
        <div class="zoom-controls"><button id="minus" type="button" class="icon-button" aria-label="Zoom out"><svg aria-hidden="true"><use href="#i-minus"/></svg></button><span id="zoomValue">100%</span><button id="plus" type="button" class="icon-button" aria-label="Zoom in"><svg aria-hidden="true"><use href="#i-plus"/></svg></button></div>
      </div>
      <div class="tool-group">
        <button id="edit" type="button" class="tool-button edit-button" aria-pressed="false"><svg aria-hidden="true"><use href="#i-edit"/></svg><span data-i18n="ui.edit">编辑模式</span></button>
        <button id="undo" type="button" class="icon-button" aria-label="Undo"><svg aria-hidden="true"><use href="#i-undo"/></svg></button>
        <button id="redo" type="button" class="icon-button" aria-label="Redo"><svg aria-hidden="true"><use href="#i-redo"/></svg></button>
        <button id="addNode" type="button" class="tool-button"><svg aria-hidden="true"><use href="#i-node"/></svg><span data-i18n="ui.addNode">添加组件</span></button>
        <button id="addEdge" type="button" class="tool-button"><svg aria-hidden="true"><use href="#i-edge"/></svg><span data-i18n="ui.addEdge">添加连线</span></button>
      </div>
      <div class="tool-group file-tools">
        <button id="save" type="button" class="tool-button"><svg aria-hidden="true"><use href="#i-save"/></svg><span data-i18n="ui.save">保存 JSON</span></button>
        <button id="load" type="button" class="tool-button"><svg aria-hidden="true"><use href="#i-load"/></svg><span data-i18n="ui.load">导入 JSON</span></button>
        <button id="saveHtml" type="button" class="tool-button"><svg aria-hidden="true"><use href="#i-page"/></svg><span data-i18n="ui.saveHtml">保存网页</span></button>
      </div>
      <div class="tool-group export-tools">
        <button id="svgExport" type="button" class="tool-button export-button"><svg aria-hidden="true"><use href="#i-export"/></svg><span>SVG</span></button>
        <button id="pngExport" type="button" class="tool-button export-button"><svg aria-hidden="true"><use href="#i-image"/></svg><span>PNG</span></button>
        <button id="drawioExport" type="button" class="tool-button export-button"><svg aria-hidden="true"><use href="#i-diagram"/></svg><span>Draw.io</span></button>
      </div>
      <div class="tool-group reset-tools"><button id="reset" type="button" class="tool-button quiet-button"><svg aria-hidden="true"><use href="#i-reset"/></svg><span data-i18n="ui.reset">恢复初始</span></button></div>
    </div>

    <div class="content-grid">
      <main id="workspace" class="workspace" aria-label="Diagram canvas">
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DEMO architecture diagram" viewBox="0 0 1940 1175" preserveAspectRatio="xMidYMid meet"></svg>
      </main>

      <aside id="inspector" class="inspector" hidden aria-label="Edit selection">
        <div class="inspector-header"><div><span class="panel-eyebrow" data-i18n="ui.properties">属性面板</span><h2 id="inspectorTitle" data-i18n="ui.selection">编辑所选元素</h2></div><button id="closeInspector" type="button" class="icon-button" aria-label="Close inspector"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
        <form id="editForm" autocomplete="off">
          <div class="inspector-body">
            <fieldset id="textFields" class="field-section">
              <legend data-i18n="ui.content">文字内容</legend>
              <label class="field"><span data-i18n="ui.itemName">名称</span><textarea id="itemName" rows="2"></textarea></label>
              <label class="field"><span data-i18n="ui.itemSubtitle">副标题</span><textarea id="itemSubtitle" rows="2"></textarea></label>
              <label class="field"><span data-i18n="ui.itemDetail">说明</span><textarea id="itemDetail" rows="3"></textarea></label>
            </fieldset>
            <fieldset id="moduleFields" class="field-section">
              <legend data-i18n="ui.moduleContent">业务模块</legend>
              <label class="field"><span data-i18n="ui.itemModules">模块名称（每行一个）</span><textarea id="itemModules" rows="5"></textarea></label>
            </fieldset>
            <fieldset id="boxFields" class="field-section">
              <legend data-i18n="ui.layoutStyle">位置与样式</legend>
              <div class="field-grid four-col">
                <label class="field"><span>X</span><input id="itemX" type="number" step="1"></label>
                <label class="field"><span>Y</span><input id="itemY" type="number" step="1"></label>
                <label class="field"><span data-i18n="ui.width">宽度</span><input id="itemW" type="number" min="1" step="1"></label>
                <label class="field"><span data-i18n="ui.height">高度</span><input id="itemH" type="number" min="1" step="1"></label>
              </div>
              <div class="field-grid two-col">
                <label class="field color-field"><span data-i18n="ui.fill">填充颜色</span><input id="itemFill" type="color" value="#ffffff"></label>
                <label class="field color-field"><span data-i18n="ui.stroke">边框颜色</span><input id="itemStroke" type="color" value="#d6e3f2"></label>
              </div>
              <label class="check-field"><input id="itemOptional" type="checkbox"><span data-i18n="ui.optional">虚线边框 / 可选能力</span></label>
            </fieldset>
            <fieldset id="nodeFields" class="field-section">
              <legend data-i18n="ui.component">组件</legend>
              <label class="field"><span data-i18n="ui.icon">图标</span><select id="itemIcon"></select></label>
            </fieldset>
            <fieldset id="annotationFields" class="field-section">
              <legend data-i18n="ui.annotation">标注</legend>
              <div class="field-grid two-col">
                <label class="field"><span data-i18n="ui.fontSize">字号</span><input id="itemSize" type="number" min="6" max="80" step="1"></label>
                <label class="field"><span data-i18n="ui.textAlign">文字对齐</span><select id="itemAnchor"><option value="start" data-i18n="ui.alignStart">左对齐</option><option value="middle" data-i18n="ui.alignMiddle">居中</option><option value="end" data-i18n="ui.alignEnd">右对齐</option></select></label>
              </div>
            </fieldset>
            <fieldset id="edgeFields" class="field-section">
              <legend data-i18n="ui.connection">连接关系</legend>
              <div class="field-grid two-col">
                <label class="field"><span data-i18n="ui.from">起点组件</span><select id="edgeFrom"></select></label>
                <label class="field"><span data-i18n="ui.to">终点组件</span><select id="edgeTo"></select></label>
                <label class="field"><span data-i18n="ui.fromPort">起点方位</span><select id="edgeFromPort"><option value="top" data-i18n="ui.top">上</option><option value="right" data-i18n="ui.right">右</option><option value="bottom" data-i18n="ui.bottom">下</option><option value="left" data-i18n="ui.left">左</option></select></label>
                <label class="field"><span data-i18n="ui.toPort">终点方位</span><select id="edgeToPort"><option value="top" data-i18n="ui.top">上</option><option value="right" data-i18n="ui.right">右</option><option value="bottom" data-i18n="ui.bottom">下</option><option value="left" data-i18n="ui.left">左</option></select></label>
                <label class="field"><span data-i18n="ui.fromFraction">起点位置（0–1）</span><input id="edgeFromFraction" type="number" min="0" max="1" step="0.05"></label>
                <label class="field"><span data-i18n="ui.toFraction">终点位置（0–1）</span><input id="edgeToFraction" type="number" min="0" max="1" step="0.05"></label>
                <label class="field"><span data-i18n="ui.edgeType">连线类型</span><select id="edgeType"><option value="api" data-i18n="ui.edgeApi">业务请求</option><option value="mqtt" data-i18n="ui.edgeMqtt">设备消息</option><option value="config" data-i18n="ui.edgeConfig">配置 / 监控</option></select></label>
                <label class="field"><span data-i18n="ui.edgeRoute">走线方向</span><select id="edgeRoute"><option value="auto" data-i18n="ui.routeAuto">自动</option><option value="horizontal" data-i18n="ui.routeHorizontal">水平优先</option><option value="vertical" data-i18n="ui.routeVertical">垂直优先</option><option value="manual" data-i18n="ui.routeManual">手动拐点</option></select></label>
                <label class="field"><span data-i18n="ui.viaX">中转 X</span><input id="edgeVia" type="number" step="1"></label>
                <label class="field"><span data-i18n="ui.viaY">中转 Y</span><input id="edgeViaY" type="number" step="1"></label>
              </div>
              <label class="field"><span data-i18n="ui.waypoints">手动拐点（每行 x,y）</span><textarea id="edgeWaypoints" rows="4" spellcheck="false"></textarea></label>
              <div class="field-grid two-col"><label class="field"><span data-i18n="ui.labelX">标签 X 偏移</span><input id="edgeLabelX" type="number" step="1"></label><label class="field"><span data-i18n="ui.labelY">标签 Y 偏移</span><input id="edgeLabelY" type="number" step="1"></label></div>
              <label class="check-field"><input id="edgeBoth" type="checkbox"><span data-i18n="ui.bothDirections">双向箭头</span></label>
            </fieldset>
            <p id="inspectorHelp" class="inspector-help" data-i18n="ui.inspectorHelp">当前语言的文字单独保存；位置、尺寸和连接关系在两种语言中共用。</p>
          </div>
          <div class="inspector-footer"><button id="deleteItem" type="button" class="delete-button"><svg aria-hidden="true"><use href="#i-trash"/></svg><span data-i18n="ui.delete">删除</span></button><button id="apply" type="submit" class="primary-button"><svg aria-hidden="true"><use href="#i-check"/></svg><span data-i18n="ui.apply">应用更改</span></button></div>
        </form>
      </aside>
    </div>

    <footer class="statusbar"><span class="status-state"><span class="status-dot"></span><span id="status" data-i18n="ui.ready">画布已就绪</span></span><span id="hint" data-i18n="ui.hint">滚轮缩放 · 拖动画布 · 开启编辑后选择元素</span><span class="status-brand">DEMO ARCHITECTURE</span></footer>
  </div>
  <input id="fileInput" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <!--DATA-->
  <!--APP-->
</body>
</html>
